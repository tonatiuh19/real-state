name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Vercel api-inline gate
        run: npm run check:api-inline
      - name: Typecheck
        run: npx tsc --noEmit
      # Unit-only — no live TiDB. DB smokes stay local / pre-deploy (validate:all).
      - name: Unit tests
        run: >
          npx vitest run --project node
          api/checkApiInline.test.ts
          shared/per-owner-crm.spec.ts
          shared/document-labels.spec.ts
          shared/broadcast-bulk.spec.ts
          shared/short-links.spec.ts
          shared/billing-period.spec.ts
          shared/o365-sync.spec.ts
          shared/broker-notification-prefs.spec.ts
          shared/broker-new-application-notify.spec.ts
      # Live TiDB HTTP suites stay local / pre-deploy (npm run test:integration).